name: Java
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp clean verify
  mensageria:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nexusverde
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: teste-local
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U nexus" --health-interval 5s --health-timeout 5s --health-retries 12
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: nexus
          RABBITMQ_DEFAULT_PASS: teste-local
        ports: ['5672:5672']
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 5s --health-retries 16
    env:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: chave-local-de-teste-da-mensageria-2026
      NEXUS_TESTE_RABBIT: 'true'
      NEXUS_RABBIT_ENABLED: 'true'
      RABBITMQ_URL: amqp://nexus:teste-local@127.0.0.1:5672
      DB_HOST: 127.0.0.1
      DB_NAME: nexusverde
      DB_USER: nexus
      DB_PASSWORD: teste-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp -Dtest=MensageriaIntegracaoTest test
