name: Circuito e agente IoT
on:
  push:
    branches: [entrega/iot-gs2026-2]
  pull_request:
permissions:
  contents: read
defaults:
  run:
    working-directory: iot
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio==6.1.18
      - run: pio run -d wokwi
  agente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/agente.sh
