<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar · Nexus Verde</title>
    <link rel="stylesheet" th:href="@{/assets/painel.css}">
</head>
<body class="login">
<main class="cartao login-cartao">
    <p class="marca">Nexus Verde</p>
    <h1>Acesso da equipe</h1>
    <p th:if="${param.erro}" class="mensagem erro" role="alert">Confira o e-mail e a senha da equipe.</p>
    <form th:action="@{/painel/entrar}" method="post" class="login-formulario">
        <label>E-mail <input type="email" name="username" autocomplete="username" required></label>
        <label>Senha <input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit">Entrar</button>
    </form>
</main>
</body>
</html>
