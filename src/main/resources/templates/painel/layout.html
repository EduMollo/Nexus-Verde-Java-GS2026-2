<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(titulo, ativo, pagina)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102f29">
    <title th:text="|${titulo} · Nexus Verde|">Nexus Verde</title>
    <link rel="stylesheet" th:href="@{/assets/painel.css(v=6)}">
</head>
<body class="painel">
<a class="pular" href="#conteudo">Ir para o conteúdo</a>
<aside class="barra-lateral">
    <a class="marca" th:href="@{/painel}">
        <span class="marca-simbolo" aria-hidden="true"></span>
        <span>Nexus Verde</span>
    </a>
    <nav class="navegacao" aria-label="Painel">
        <a th:href="@{/painel}" th:classappend="${ativo == 'inicio'} ? 'selecionado'" th:attr="aria-current=${ativo == 'inicio'} ? 'page' : null"><span class="icone icone-grade" aria-hidden="true"></span>Visão geral</a>
        <a th:href="@{/painel/solicitacoes}" th:classappend="${ativo == 'solicitacoes'} ? 'selecionado'" th:attr="aria-current=${ativo == 'solicitacoes'} ? 'page' : null"><span class="icone icone-lista" aria-hidden="true"></span>Solicitações</a>
        <a th:href="@{/painel/pontos-agua}" th:classappend="${ativo == 'pontos'} ? 'selecionado'" th:attr="aria-current=${ativo == 'pontos'} ? 'page' : null"><span class="icone icone-gota" aria-hidden="true"></span>Pontos de água</a>
        <a th:if="${@acessoUsuarios.podeGerenciar()}" th:href="@{/painel/usuarios}"
           th:classappend="${ativo == 'usuarios'} ? 'selecionado'" th:attr="aria-current=${ativo == 'usuarios'} ? 'page' : null">
            <span class="icone icone-usuario" aria-hidden="true"></span>Usuários
        </a>
    </nav>
    <form class="sair" th:action="@{/painel/sair}" method="post">
        <button type="submit"><span class="icone icone-sair" aria-hidden="true"></span>Sair</button>
    </form>
</aside>
<main id="conteudo" class="conteudo" tabindex="-1">
    <div class="cabecalho">
        <span>Área da equipe</span>
        <span th:if="${demo}" class="demo" title="Pedidos e pontos fictícios">Demonstração acadêmica</span>
    </div>
    <p th:if="${sucesso}" class="mensagem mensagem-pagina" role="status" th:text="${sucesso}"></p>
    <p th:if="${erro}" class="mensagem mensagem-pagina erro" role="alert" th:text="${erro}"></p>
    <p th:if="${param.formularioExpirado}" class="mensagem mensagem-pagina aviso" role="alert">O formulário expirou. A ação não foi executada. Abra a página novamente e tente outra vez.</p>
    <div th:replace="${pagina}"></div>
</main>
</body>
</html>
