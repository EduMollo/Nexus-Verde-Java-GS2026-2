name: Reservatório e alerta local
version: 1
author: Nexus Verde
steps:
  - wait-serial: 'Cole a linha de pareamento'
  - set-control:
      part-id: nivel
      name: position
      value: 1
  - wait-serial: 'alerta: desligado'
  - set-control:
      part-id: nivel
      name: position
      value: 0
  - wait-serial: 'alerta: ligado'
