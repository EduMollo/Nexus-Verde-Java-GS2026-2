services:
  - type: web
    name: nexus-verde-java-gs2026-2
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod,demo
      - key: DB_HOST
        fromDatabase:
          name: nexus-verde-gs2026-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nexus-verde-gs2026-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: nexus-verde-gs2026-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: nexus-verde-gs2026-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nexus-verde-gs2026-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: EQUIPE_EMAIL
        value: equipe@nexusverde.example
      - key: EQUIPE_SENHA
        sync: false
